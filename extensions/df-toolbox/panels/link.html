<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DF Toolbox — Link</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px;
      padding: 16px;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      font-size: 13px;
    }
    h1 {
      font-size: 16px;
      margin-bottom: 12px;
      color: #00d4ff;
    }
    .status {
      padding: 8px 12px;
      border-radius: 6px;
      margin-bottom: 12px;
      font-size: 12px;
      background: #16213e;
      border: 1px solid #0f3460;
    }
    .code-box {
      background: #0f3460;
      padding: 10px 14px;
      border-radius: 6px;
      font-family: 'Consolas', monospace;
      font-size: 18px;
      text-align: center;
      letter-spacing: 4px;
      margin-bottom: 12px;
      color: #00d4ff;
      user-select: all;
    }
    .input-group {
      margin-bottom: 12px;
    }
    .input-group label {
      display: block;
      font-size: 11px;
      color: #888;
      margin-bottom: 4px;
    }
    .input-group input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #0f3460;
      border-radius: 6px;
      background: #16213e;
      color: #e0e0e0;
      font-size: 13px;
      outline: none;
    }
    .input-group input:focus {
      border-color: #00d4ff;
    }
    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      background: #00d4ff;
      color: #1a1a2e;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }
    button:hover { background: #00b8d9; }
    button:disabled {
      background: #555;
      color: #888;
      cursor: not-allowed;
    }
    .hint {
      margin-top: 12px;
      font-size: 11px;
      color: #666;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <h1>DF Toolbox — Link</h1>

  <div class="status" id="status">Đang tải...</div>

  <div class="code-box" id="claim-code">------</div>

  <div class="input-group">
    <label>Dán mã claim từ Discord DM</label>
    <input type="text" id="claim-code-input" placeholder="VD: ABC123" maxlength="6" />
  </div>

  <button id="submit-btn" disabled>Submit Link</button>

  <div class="hint">
    1. Dùng <code>/df-link start</code> trên Discord<br>
    2. Dán mã claim vào ô trên<br>
    3. Truy cập HQ, đăng nhập → chờ script capture<br>
    4. Nhấn Submit
  </div>

  <script src="../modules/link/panel.js"></script>
</body>
</html>
