<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Config — Pon1147</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="container">
      <div class="header">
        <img class="icon" src="../assets/icon_16.png" alt="icon">
        <h1>Garena Redeem</h1>
      </div>

      <div class="info-card">
        <p class="info-text">Dashboard đang hiển thị trên trang.</p>
        <p class="info-sub">Kéo panel bằng thanh drag handle phía trên.</p>
      </div>

      <div class="section">
        <label class="label">Tùy chỉnh codes (mỗi dòng 1 code):</label>
        <textarea
          class="codes-input"
          id="codesInput"
          placeholder="DFSL9304&#10;DFSL6257&#10;..."
        ></textarea>
      </div>

      <div class="actions">
        <button class="btn btn-save" id="btnSave">💾 Lưu codes</button>
        <button class="btn btn-reset" id="btnReset">🔄 Reset default</button>
      </div>

      <div class="footer">
        <span>Pon1147 Redeem Tool</span>
        <a href="https://discord.gg/vz6w6c3Xe3" target="_blank">Discord</a>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
