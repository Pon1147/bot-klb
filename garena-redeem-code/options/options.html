<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>DF Toolbox — Settings</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 400px;
      padding: 20px;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
    }
    h2 { color: #00d4ff; margin-bottom: 16px; font-size: 16px; }
    label { display: block; margin-bottom: 8px; font-size: 13px; color: #aaa; }
    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #0f3460;
      border-radius: 6px;
      background: #16213e;
      color: #e0e0e0;
      font-size: 13px;
      margin-bottom: 16px;
      outline: none;
    }
    input:focus { border-color: #00d4ff; }
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      background: #00d4ff;
      color: #1a1a2e;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #00b8d9; }
    .status { margin-top: 12px; font-size: 12px; color: #4caf50; }
  </style>
</head>
<body>
  <h2>DF Toolbox — Settings</h2>
  <label for="claimBaseUrl">Claim API Base URL:</label>
  <input type="text" id="claimBaseUrl" placeholder="https://your-bot-url.trycloudflare.com" />
  <button id="saveBtn">Save</button>
  <div class="status" id="status"></div>

  <script src="options.js"></script>
</body>
</html>
